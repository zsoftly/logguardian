name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: '1.24'

jobs:
  build-lambda:
    name: Build Lambda Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Lambda binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o build/bootstrap \
            ./cmd/lambda

      - name: Create Lambda deployment package
        run: |
          mkdir -p dist
          cd build && zip -r ../dist/logguardian-compliance.zip bootstrap
          cd ..
          # Also create a versioned copy
          cp dist/logguardian-compliance.zip dist/logguardian-compliance-${{ github.ref_name }}.zip

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v5
        with:
          name: lambda-package
          path: |
            dist/logguardian-compliance.zip
            dist/logguardian-compliance-${{ github.ref_name }}.zip

  build-container:
    name: Build Container Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build container binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o build/logguardian-container \
            ./cmd/container
          
          # Create versioned copy
          cp build/logguardian-container build/logguardian-container-${{ github.ref_name }}

      - name: Create tarball
        run: |
          tar -czf build/logguardian-container-${{ github.ref_name }}.tar.gz \
            -C build logguardian-container

      - name: Upload container artifact
        uses: actions/upload-artifact@v5
        with:
          name: container-binary
          path: |
            build/logguardian-container
            build/logguardian-container-${{ github.ref_name }}
            build/logguardian-container-${{ github.ref_name }}.tar.gz

  publish-docker:
    name: Publish Docker Image
    needs: build-container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build_and_push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build_and_push.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub Release
    needs: [build-lambda, build-container, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lambda-package/*.zip
            artifacts/container-binary/*.tar.gz
          body: |
            # Release ${{ github.ref_name }}
            
            LogGuardian Compliance Lambda and Container.
            
            ## Docker Image
            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            
            ## Changes
            See commit history for details.
          draft: false
          prerelease: false
